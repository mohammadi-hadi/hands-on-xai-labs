name: notebooks-smoke

# Weekly canary: catches upstream library/API churn before readers do.
# Smoke mode swaps in tiny models and tiny data; the mechinterp notebooks
# (chapter 10) are skipped here because their stack is too heavy for a
# scheduled runner, and are exercised on release instead.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}

      - name: Install environment
        run: uv sync --frozen --group llm

      - name: Execute notebooks (smoke mode)
        run: BOOK_SMOKE=1 .venv/bin/python scripts/run_notebooks.py

      # GitHub disables scheduled workflows after 60 days without a push;
      # re-enabling on every run keeps this canary alive.
      - name: Keep the scheduled workflow enabled
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/smoke.yml/enable
